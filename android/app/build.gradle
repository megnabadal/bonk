plugins {
    id 'com.android.application'
}

android {
    namespace 'com.megna.bonk'
    compileSdk 34

    defaultConfig {
        applicationId "com.megna.bonk"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // One fixed signing key, so each new APK from GitHub installs as an update
    // instead of failing with "App not installed". (A debug key: fine for personal use.)
    signingConfigs {
        bonk {
            storeFile file("bonk-debug.keystore")
            storePassword "android"
            keyAlias "bonk"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.bonk }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
